name: Academy task
about: Track a module, lesson, research, review, or maintenance task with reusable execution state.
title: "[Academy task] "
labels: []
body:
  - type: input
    id: task_id
    attributes:
      label: Task ID
      description: Unique ID matching .academy/state/tasks/<TASK-ID>.json.
      placeholder: SD-DB-INDEXES
    validations:
      required: true
  - type: dropdown
    id: task_type
    attributes:
      label: Task type
      options:
        - Module
        - Lesson
        - Source research
        - Technical review
        - Pedagogical review
        - Provenance review
        - Tooling / maintenance
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal and Definition of Done
      description: State the outcome and objective acceptance checks.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and constraints
      description: Link prerequisite Issues, required sources, scope boundaries, and constraints.
    validations:
      required: false
  - type: input
    id: state_file
    attributes:
      label: Repository state file
      placeholder: .academy/state/tasks/SD-DB-INDEXES.json
    validations:
      required: true
  - type: input
    id: owner_branch
    attributes:
      label: Owner and working branch
      description: One active writer per task/lesson; list the owner and branch here.
    validations:
      required: false
  - type: textarea
    id: checkpoint
    attributes:
      label: Latest checkpoint and next action
      description: Keep this brief; detailed checkpoints belong in the task JSON and JSONL worklog.
    validations:
      required: false
  - type: input
    id: linked_pr
    attributes:
      label: Pull request
      placeholder: https://github.com/owner/repo/pull/123
    validations:
      required: false