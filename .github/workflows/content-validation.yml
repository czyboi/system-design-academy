name: Content validation

# Run from GitHub Actions > Content validation > Run workflow only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate course content structure
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate current lesson packages, workflow configuration and relative links
        run: python scripts/validate_content.py
      - name: Validate authored Markdown format (no LLM)
        run: python scripts/validate_format.py
      - name: Validate workflow configuration independently
        run: python scripts/validate_content.py --scope workflow
      - name: Validate persistent task state records
        run: python scripts/taskctl.py validate
