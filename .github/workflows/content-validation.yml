name: Content validation

on:
  pull_request:
    paths:
      - '**.md'
      - '**.csv'
      - '**.json'
      - '**.toml'
      - '.agents/**'
      - '.claude/**'
      - 'requirements-dev.txt'
      - '.academy/**'
      - 'tests/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.codex/**'
      - 'AGENTS.md'
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/content-validation.yml'
  push:
    branches: [main]
    paths:
      - '**.md'
      - '**.csv'
      - '**.json'
      - '**.toml'
      - '.agents/**'
      - '.academy/**'
      - 'tests/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.codex/**'
      - 'AGENTS.md'
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/content-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate course content structure
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate Markdown lessons, source registry, manifest, and relative links
        run: python scripts/validate_content.py
      - name: Validate persistent task state records
        run: python scripts/taskctl.py validate
      - name: Run task state integration tests
        run: python -m unittest discover -s tests -v
