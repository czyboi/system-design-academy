name: Content validation

on:
  pull_request:
    paths:
      - '**.md'
      - '**.csv'
      - '**.json'
      - '**.toml'
      - '.agents/**'
      - '.claude/**'
      - 'requirements-dev.txt'
      - '.academy/**'
      - 'tests/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.codex/**'
      - 'AGENTS.md'
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/content-validation.yml'
  push:
    branches: [main]
    paths:
      - '**.md'
      - '**.csv'
      - '**.json'
      - '**.toml'
      - '.agents/**'
      - '.academy/**'
      - 'tests/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.codex/**'
      - 'AGENTS.md'
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/content-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate course content structure
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch pinned MS01/MS02 snapshot commits
        run: |
          git fetch --no-tags origin refs/heads/codex/SDA-MS01 refs/heads/codex/SDA-MS02
          git cat-file -e e823c8d72e59f1691ce7bfc65f37c209066eca99^{commit}
          git cat-file -e ec753d7bcfd69ad68e5fff260aeb088059e42540^{commit}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate current lesson packages, workflow configuration and relative links
        run: python scripts/validate_content.py
      - name: Validate authored Markdown format (no LLM)
        run: python scripts/validate_format.py
      - name: Validate workflow configuration independently
        run: python scripts/validate_content.py --scope workflow
      - name: Validate persistent task state records
        run: python scripts/taskctl.py validate
      - name: Run task state and pinned format regression tests
        env:
          SDA_TEST_PINNED_CONTENT: '1'
        run: python -m unittest discover -s tests -v
